<section class="section-card">
  <h2 class="section-title">ثبت هزینه</h2>
  <form id="expenseForm">
    <div class="grid-3">
      <div>
        <label for="expenseScope">دامنه هزینه</label>
        <select id="expenseScope">
          <option value="business">کسب و کار</option>
          <option value="shared">مشترک</option>
        </select>
      </div>
      <div>
        <label for="expensePaidBy">پرداخت کننده</label>
        <input id="expensePaidBy" placeholder="شرکت / همکار" />
      </div>
      <div>
        <label for="expenseCategory">دسته بندی</label>
        <input id="expenseCategory" required />
      </div>
      <div>
        <label for="expenseAmount">مبلغ (تومان)</label>
        <input
          id="expenseAmount"
          type="text"
          class="money-input"
          inputmode="numeric"
          placeholder="100,000"
          required
        />
      </div>
      <div>
        <label for="expenseDate">تاریخ</label>
        <input
          id="expenseDate"
          type="text"
          data-jdp
          inputmode="numeric"
          autocomplete="off"
          placeholder="1404/01/01"
          required
        />
      </div>
    </div>
    <div>
      <label for="expenseDesc">توضیحات</label>
      <textarea id="expenseDesc"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-primary" type="submit">ثبت هزینه</button>
    </div>
  </form>
</section>

<section class="section-card">
  <h3 class="section-title">لیست هزینه ها</h3>
  <div class="filter-grid">
    <input id="expensesSearch" placeholder="جستجو در دامنه/دسته/توضیح" />
    <select id="expensesScopeFilter">
      <option value="">همه دامنه ها</option>
      <option value="business">کسب و کار</option>
      <option value="shared">مشترک</option>
    </select>
    <input id="expensesFrom" data-jdp placeholder="از تاریخ" />
    <input id="expensesTo" data-jdp placeholder="تا تاریخ" />
    <button id="expensesFilterReset" type="button" class="btn-secondary">پاکسازی</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>دامنه</th>
        <th>دسته بندی</th>
        <th>مبلغ</th>
        <th>تاریخ</th>
        <th>توضیح</th>
        <th>عملیات</th>
      </tr>
    </thead>
    <tbody id="expensesRows"></tbody>
  </table>
</section>
